services:
  - type: web
    name: greenscope-satellite
    runtime: python
    rootDir: satellite_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: EE_PROJECT
        sync: false
      - key: EE_SERVICE_ACCOUNT
        sync: false
      - key: EE_SERVICE_ACCOUNT_KEY_JSON
        sync: false
      - key: SATELLITE_SERVICE_TOKEN
        sync: false
